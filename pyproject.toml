[project]
name = "aether-deep-agent-service"
version = "0.1.0"
description = "Async Deep Agents execution service for Aether."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "deepagents>=0.6.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-openai>=0.3.0",
    "mcp>=1.12.0,<2.0.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "pyjwt>=2.10.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
aether-deep-agent-service = "aether_deep_agent_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
